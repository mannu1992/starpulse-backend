name: Starpulse Automated Data Fetcher

on:
  schedule:
    # Market Hours (Monday to Friday, Har 15 mins: 9:15 AM - 3:30 PM IST)
    - cron: '*/15 3-10 * * 1-5'
  workflow_dispatch: # Manual run test karne ke liye button

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install smartapi-python pyotp logzero

      - name: Run Angel One Fetcher Script
        env:
          ANGEL_API_KEY: ${{ secrets.ANGEL_API_KEY }}
          ANGEL_CLIENT_ID: ${{ secrets.ANGEL_CLIENT_ID }}
          ANGEL_PIN: ${{ secrets.ANGEL_PIN }}
          ANGEL_TOTP_SECRET: ${{ secrets.ANGEL_TOTP_SECRET }}
        run: |
          python main.py
